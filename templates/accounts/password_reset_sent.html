{% extends 'base.html' %}
{% block title %}أُرسل الرابط{% endblock %}
{% block content %}
<div class="wrap auth-shell">
  <div class="card card-pad center">
    <i class="bi bi-envelope-check" style="font-size:2.4rem;color:var(--ok)"></i>
    <h1 style="font-size:1.3rem">تفقّد بريدك</h1>

  </div>
</div>
{% endblock %}
