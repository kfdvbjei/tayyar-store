{% extends 'base.html' %}
{% block title %}كلمة مرور جديدة{% endblock %}
{% block content %}
<div class="wrap auth-shell">
  <div class="card card-pad">
    <h1 style="font-size:1.3rem">كلمة مرور جديدة</h1>
    <p class="muted small">اختر كلمة مرور قوية لا تقل عن ٨ أحرف.</p>
    <form method="post">{% csrf_token %}
      {% for f in form %}
      <div class="field"><label for="{{ f.id_for_label }}">{{ f.label }}</label>{{ f }}
        {% if f.help_text %}<span class="helptext">{{ f.help_text|safe }}</span>{% endif %}{{ f.errors }}</div>
      {% endfor %}
      <button class="btn btn-volt btn-block">متابعة</button>
    </form>
  </div>
</div>
{% endblock %}
